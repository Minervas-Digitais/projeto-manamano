name: manamano

services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ${DOCKER_TARGET:-runtime-dev}
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}?schema=public
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/landing:/usr/share/nginx/html
      - ./nginx/downloads:/usr/share/nginx/html/downloads

volumes:
  postgres_data:
