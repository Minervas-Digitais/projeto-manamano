events {}

http {
  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }

    location /downloads/ {
      alias /usr/share/nginx/html/downloads/;
      autoindex off;
      add_header Cache-Control "no-cache";
    }
  }
}